<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Random Dota 2 hero roulette — spin to pick your next hero.">
  <title>Dota 2 Hero Roulette</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      touch-action: none;
      padding: 20px 10px;
      transition: background 0.4s ease, color 0.3s ease;
    }

    /* ========== DEFAULT THEME ========== */
    body.theme-default {
      background: radial-gradient(ellipse at center, #1a1a2e 0%, #0d0d1a 70%, #000 100%);
      color: #e8e6e3;
    }
    body.theme-default h1 {
      background: linear-gradient(90deg, #c9aa71, #f0e6d2, #c9aa71);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    body.theme-default .filter-btn.active {
      background: linear-gradient(135deg, #c9aa71, #a88b4a);
      color: #0d0d1a;
      border-color: #c9aa71;
    }
    body.theme-default .hero-card.center {
      box-shadow: 0 0 0 3px #c9aa71, 0 15px 40px rgba(201, 170, 113, 0.35);
      border-color: #c9aa71;
    }
    body.theme-default .selected-name { color: #c9aa71; }
    body.theme-default .spin-btn {
      background: linear-gradient(135deg, #c9aa71, #e8d5a3);
      color: #0d0d1a;
      box-shadow: 0 4px 15px rgba(201, 170, 113, 0.4);
    }

    /* ========== MLG THEME ========== */
    body.theme-mlg {
      background: transparent;
      color: #39ff14;
      font-family: 'Courier New', monospace;
    }
    body.theme-mlg h1 {
      background: none;
      -webkit-text-fill-color: #39ff14;
      color: #39ff14;
      text-shadow: 0 0 10px #39ff14, 0 0 20px #39ff14, 2px 2px 0 #ff00ff;
      font-family: Impact, Haettenschweiler, 'Arial Black', sans-serif;
      letter-spacing: 3px;
      animation: mlgGlow 0.8s ease-in-out infinite alternate;
    }
    @keyframes mlgGlow {
      from { text-shadow: 0 0 10px #39ff14, 0 0 20px #39ff14, 2px 2px 0 #ff00ff; }
      to { text-shadow: 0 0 20px #39ff14, 0 0 40px #39ff14, 0 0 60px #ff00ff, 3px 3px 0 #ff00ff; }
    }
    body.theme-mlg .subtitle {
      color: #ff00ff;
      text-transform: uppercase;
      font-weight: bold;
    }
    body.theme-mlg .filter-btn {
      background: #111;
      border: 2px solid #39ff14;
      color: #39ff14;
      border-radius: 0;
      text-transform: uppercase;
    }
    body.theme-mlg .filter-btn.active {
      background: #39ff14;
      color: #000;
      box-shadow: 0 0 15px #39ff14;
    }
    body.theme-mlg .hero-card {
      border: 2px solid #39ff14;
      border-radius: 0;
      box-shadow: 0 0 15px rgba(57, 255, 20, 0.3);
      filter: contrast(1.2) saturate(1.3);
    }
    body.theme-mlg .hero-card.center {
      box-shadow: 0 0 0 3px #39ff14, 0 0 25px #39ff14, 0 0 40px #ff00ff;
      border-color: #39ff14;
      transform: scale(1.15);
      filter: contrast(1.4) saturate(1.5) brightness(1.1);
    }
    body.theme-mlg .hero-card .name {
      background: linear-gradient(transparent, rgba(0,0,0,0.95));
      color: #39ff14;
      font-family: Impact, Haettenschweiler, 'Arial Black', sans-serif;
      text-transform: uppercase;
    }
    body.theme-mlg .selected-name {
      color: #39ff14;
      text-shadow: 0 0 15px #39ff14, 2px 2px 0 #ff00ff;
      font-family: Impact, Haettenschweiler, 'Arial Black', sans-serif;
      text-transform: uppercase;
    }
    body.theme-mlg .spin-btn {
      background: #39ff14;
      color: #000;
      border-radius: 0;
      box-shadow: 0 0 20px #39ff14;
      font-family: Impact, Haettenschweiler, 'Arial Black', sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    body.theme-mlg .spin-btn:hover {
      background: #ff00ff;
      box-shadow: 0 0 25px #ff00ff;
    }
    body.theme-mlg .hint, body.theme-mlg .count, body.theme-mlg .selected-label {
      color: #39ff14;
      opacity: 0.7;
    }
    body.theme-mlg .carousel-wrapper::before,
    body.theme-mlg .carousel-wrapper::after {
      background: linear-gradient(to right, #000 10%, transparent);
    }
    body.theme-mlg .carousel-wrapper::after {
      background: linear-gradient(to left, #000 10%, transparent);
    }

    /* ========== MLG LANDING MEME POPUP ========== */
    #mlgMeme {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      overflow: hidden;
    }
    #mlgMeme.show { display: flex; }
    #mlgMeme .flash {
      position: absolute;
      inset: 0;
      background: #39ff14;
      opacity: 0;
    }
    #mlgMeme.show .flash {
      animation: memeFlash 0.55s ease-out forwards;
    }
    @keyframes memeFlash {
      0%   { opacity: 0.85; }
      100% { opacity: 0; }
    }
    #mlgMeme .meme-text {
      position: relative;
      z-index: 2;
      max-width: 92vw;
      font-family: Impact, Haettenschweiler, 'Arial Black', sans-serif;
      font-size: clamp(2.4rem, 11vw, 8rem);
      line-height: 0.9;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: #fff;
      -webkit-text-stroke: 3px #000;
      text-shadow: 0 0 15px #ff00ff, 0 0 35px #39ff14,
                   8px 8px 0 #ff00ff, -8px -8px 0 #39ff14;
      opacity: 0;
    }
    #mlgMeme.show .meme-text {
      animation: memeSlam 1.9s cubic-bezier(.2, 1.4, .3, 1) forwards;
    }
    @keyframes memeSlam {
      0%   { opacity: 0; transform: rotate(-14deg) scale(0.2); }
      12%  { opacity: 1; transform: rotate(-6deg) scale(1.3); }
      22%  { transform: rotate(-5deg) scale(1); }
      75%  { opacity: 1; transform: rotate(-5deg) scale(1.04); }
      100% { opacity: 0; transform: rotate(-5deg) scale(1.1); }
    }
    #mlgMeme .meme-emoji {
      position: fixed;
      z-index: 1;
      font-size: clamp(2rem, 6vw, 4.5rem);
      filter: drop-shadow(0 0 12px #39ff14);
      animation: memeFloat 1.6s ease-out forwards;
    }
    @keyframes memeFloat {
      0%   { opacity: 0; transform: scale(0.3) rotate(0deg); }
      20%  { opacity: 1; }
      100% { opacity: 0; transform: scale(1.5) rotate(30deg); }
    }

    /* ========== MLG ANIMATED BACKGROUND ========== */
    html { background: #000; }

    #mlgBackground {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.35s ease;
      background: radial-gradient(ellipse at center, #16002e 0%, #000 72%);
    }
    body.theme-mlg #mlgBackground { opacity: 1; }
    #mlgBackground > div { position: absolute; }

    .mlg-rays {
      left: 50%;
      top: 50%;
      width: 200vmax;
      height: 200vmax;
      margin: -100vmax 0 0 -100vmax;
      background: repeating-conic-gradient(from 0deg,
        rgba(57, 255, 20, 0.16) 0deg 7deg,
        transparent 7deg 22deg,
        rgba(255, 0, 255, 0.16) 22deg 30deg,
        transparent 30deg 50deg);
      animation: mlgSpin 16s linear infinite;
    }
    @keyframes mlgSpin { to { transform: rotate(360deg); } }

    .mlg-grid {
      inset: -60%;
      background-image:
        linear-gradient(rgba(57, 255, 20, 0.28) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 0, 255, 0.24) 1px, transparent 1px);
      background-size: 70px 70px;
      transform: perspective(620px) rotateX(62deg) scale(1.8);
      opacity: 0.4;
      animation: mlgGrid 2.2s linear infinite;
    }
    @keyframes mlgGrid { to { background-position: 0 70px, 70px 0; } }

    .mlg-stripes {
      inset: -60%;
      background: repeating-linear-gradient(45deg,
        rgba(255, 0, 255, 0.10) 0 16px,
        transparent 16px 46px);
      animation: mlgSlide 1.8s linear infinite;
    }
    @keyframes mlgSlide { to { transform: translate(46px, 46px); } }

    .mlg-scanlines {
      inset: 0;
      background: repeating-linear-gradient(0deg,
        rgba(0, 0, 0, 0.55) 0 2px,
        transparent 2px 4px);
      animation: mlgFlicker 1.9s steps(2) infinite;
    }
    @keyframes mlgFlicker {
      0%, 100% { opacity: 0.3; }
      50%      { opacity: 0.6; }
    }

    #mlgBackground::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg,
        rgba(57, 255, 20, 0.20),
        rgba(255, 0, 255, 0.22),
        rgba(0, 255, 255, 0.16));
      mix-blend-mode: screen;
      opacity: 0.35;
      animation: mlgPulse 3.2s ease-in-out infinite alternate;
    }
    @keyframes mlgPulse {
      from { opacity: 0.2; }
      to   { opacity: 0.65; }
    }

    .mlg-sprites { inset: 0; }
    .mlg-sprites span {
      position: absolute;
      opacity: 0.75;
      filter: drop-shadow(0 0 10px #39ff14);
      animation-name: mlgDrift;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      will-change: transform, opacity;
    }
    @keyframes mlgDrift {
      0%   { transform: translate3d(0, 0, 0) rotate(0deg) scale(0.7); opacity: 0.25; }
      25%  { opacity: 0.9; }
      50%  { transform: translate3d(28vw, -45vh, 0) rotate(200deg) scale(1.35); }
      75%  { opacity: 0.7; }
      100% { transform: translate3d(-18vw, -80vh, 0) rotate(400deg) scale(0.7); opacity: 0; }
    }

    /* ========== MLG CROSSHAIR SCROLL TICKS ========== */
    #mlgTicks {
      position: fixed;
      inset: 0;
      z-index: 9998;
      pointer-events: none;
      overflow: hidden;
    }
    .mlg-tick {
      position: absolute;
      width: 46px;
      height: 46px;
      margin: -23px 0 0 -23px;
      border: 2px solid rgba(57, 255, 20, 0.9);
      border-radius: 50%;
      mix-blend-mode: screen;
      animation: tickPop 0.55s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }
    .mlg-tick::before,
    .mlg-tick::after {
      content: '';
      position: absolute;
      background: #39ff14;
      box-shadow: 0 0 8px #39ff14, 0 0 18px #ff00ff;
    }
    .mlg-tick::before {
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      transform: translateX(-1px);
    }
    .mlg-tick::after {
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      transform: translateY(-1px);
    }
    .mlg-tick.pink {
      border-color: rgba(255, 0, 255, 0.9);
    }
    .mlg-tick.pink::before,
    .mlg-tick.pink::after {
      background: #ff00ff;
      box-shadow: 0 0 8px #ff00ff, 0 0 18px #39ff14;
    }
    @keyframes tickPop {
      0%   { opacity: 0; transform: scale(0.25) rotate(var(--rot, 0deg)); }
      30%  { opacity: 1; transform: scale(1.25) rotate(var(--rot, 0deg)); }
      100% { opacity: 0; transform: scale(1.7) rotate(calc(var(--rot, 0deg) + 20deg)); }
    }

    @media (prefers-reduced-motion: reduce) {
      #mlgBackground * { animation: none !important; }
      .mlg-tick { animation-duration: 0.01s; }
    }

    /* Shared base styles */
    h1 {
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.85rem;
      margin-bottom: 14px;
      letter-spacing: 1px;
      opacity: 0.8;
    }

    .filters {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      width: 100%;
      max-width: 720px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .filter-btn {
      padding: 7px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      background: rgba(255,255,255,0.05);
      border: 1px solid #3a3a4a;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s ease;
      color: inherit;
    }

    .filter-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .attr-str.active { background: linear-gradient(135deg, #c23c2a, #8b2a1a) !important; border-color: #c23c2a !important; color: #fff !important; }
    .attr-agi.active { background: linear-gradient(135deg, #2a8c3a, #1a5c2a) !important; border-color: #2a8c3a !important; color: #fff !important; }
    .attr-int.active { background: linear-gradient(135deg, #2a6ac2, #1a3a8b) !important; border-color: #2a6ac2 !important; color: #fff !important; }
    .attr-all.active { background: linear-gradient(135deg, #9b59b6, #6c3483) !important; border-color: #9b59b6 !important; color: #fff !important; }

    .carousel-wrapper {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 300px;
      perspective: 1200px;
      overflow: hidden;
    }

    .carousel-track {
      display: flex;
      align-items: center;
      height: 100%;
      will-change: transform;
      cursor: grab;
    }

    .carousel-track.grabbing {
      cursor: grabbing;
    }

    .hero-card {
      flex: 0 0 200px;
      height: 260px;
      margin: 0 10px;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      background: #111;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      border: 2px solid #2a2a3a;
    }

    .hero-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .hero-card .name {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 8px 10px;
      background: linear-gradient(transparent, rgba(0,0,0,0.92));
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.4px;
      color: #f0e6d2;
    }

    .hero-card.center {
      transform: scale(1.12);
      z-index: 10;
      filter: brightness(1.1);
    }

    .hero-card.center .name {
      color: #fff;
    }

    .carousel-wrapper::before,
    .carousel-wrapper::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100px;
      z-index: 20;
      pointer-events: none;
    }

    .carousel-wrapper::before {
      left: 0;
      background: linear-gradient(to right, #0d0d1a 10%, transparent);
    }

    .carousel-wrapper::after {
      right: 0;
      background: linear-gradient(to left, #0d0d1a 10%, transparent);
    }

    .selected-panel {
      margin-top: 28px;
      text-align: center;
      min-height: 80px;
    }

    .selected-label {
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 4px;
      opacity: 0.7;
    }

    .selected-name {
      font-size: 2rem;
      font-weight: 700;
      transition: all 0.3s ease;
    }

    .selected-name.pop {
      transform: scale(1.12);
    }

    .hint {
      margin-top: 18px;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
      opacity: 0.6;
    }

    .spin-btn {
      margin-top: 16px;
      padding: 11px 32px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .spin-btn:hover {
      transform: translateY(-2px);
    }

    .spin-btn:active {
      transform: translateY(0);
    }

    .count {
      font-size: 0.75rem;
      margin-top: 6px;
      opacity: 0.6;
    }
  </style>
</head>
<body class="theme-default">
  <script>
    // Apply the saved theme before first paint to avoid a flash
    try {
      if (localStorage.getItem('dotaslider-theme') === 'mlg') {
        document.body.className = 'theme-mlg';
      }
    } catch (e) {}
  </script>
  <div id="mlgBackground" aria-hidden="true">
    <div class="mlg-rays"></div>
    <div class="mlg-grid"></div>
    <div class="mlg-stripes"></div>
    <div class="mlg-scanlines"></div>
    <div class="mlg-sprites" id="mlgSprites"></div>
  </div>
  <div id="mlgTicks" aria-hidden="true"></div>

  <h1>Dota 2 Hero Roulette</h1>
  <p class="subtitle">Flick • Drag • Scroll wheel • Lands on a hero</p>

  <div class="filters">
    <div class="filter-row" id="themeFilters">
      <button class="filter-btn active" data-theme="default">Default</button>
      <button class="filter-btn" data-theme="mlg">MLG</button>
    </div>
    <div class="filter-row" id="attrFilters">
      <button class="filter-btn active" data-attr="any">All Attr</button>
      <button class="filter-btn attr-str" data-attr="str">Strength</button>
      <button class="filter-btn attr-agi" data-attr="agi">Agility</button>
      <button class="filter-btn attr-int" data-attr="int">Intelligence</button>
      <button class="filter-btn attr-all" data-attr="all">Universal</button>
    </div>
  </div>

  <div class="carousel-wrapper" id="wrapper">
    <div class="carousel-track" id="track"></div>
  </div>

  <div class="selected-panel">
    <div class="selected-label">Selected Hero</div>
    <div class="selected-name" id="selectedName">—</div>
    <div class="count" id="heroCount"></div>
  </div>

  <button class="spin-btn" id="spinBtn">Spin Random</button>
  <p class="hint">Drag / swipe / scroll wheel • lands with momentum</p>

  <!-- MLG Hitmarker sound -->
  <audio id="hitmarker" preload="auto" src="https://instrumentalfx.co/wp-content/uploads/2017/12/Hitmarker_-_MLG_Sound_Effect.mp3"></audio>

  <!-- MLG landing meme popup -->

    <div class="flash"></div>
    <div class="meme-text" id="memeText"></div>
    <div id="memeEmojis"></div>
  </div>

      {id:"templar_assassin", name:"Templar Assassin", attr:"agi", hard:0},

      {id:"tidehunter", name:"Tidehunter", attr:"str", hard:0},

      {id:"treant", name:"Treant Protector", attr:"str", hard:0},
      {id:"troll_warlord", name:"Troll Warlord", attr:"agi", hard:0},
      {id:"tusk", name:"Tusk", attr:"str", hard:0},
      {id:"abyssal_underlord", name:"Underlord", attr:"str", hard:0},
      {id:"undying", name:"Undying", attr:"str", hard:1},
      {id:"ursa", name:"Ursa", attr:"agi", hard:0},
      {id:"vengefulspirit", name:"Vengeful Spirit", attr:"agi", hard:1},
      {id:"venomancer", name:"Venomancer", attr:"all", hard:0},
      {id:"viper", name:"Viper", attr:"agi", hard:0},
      {id:"visage", name:"Visage", attr:"all", hard:0},
      {id:"void_spirit", name:"Void Spirit", attr:"all", hard:0},
      {id:"warlock", name:"Warlock", attr:"int", hard:1},
      {id:"weaver", name:"Weaver", attr:"agi", hard:0},
      {id:"windrunner", name:"Windranger", attr:"all", hard:0},
      {id:"winter_wyvern", name:"Winter Wyvern", attr:"int", hard:1},
      {id:"witch_doctor", name:"Witch Doctor", attr:"int", hard:1},
      {id:"skeleton_king", name:"Wraith King", attr:"str", hard:0},
      {id:"zuus", name:"Zeus", attr:"int", hard:0}
    ];

    const IMG_BASE = 'https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/';
    const CARD_WIDTH = 220;

    let currentMode = 'all';
    let currentAttr = 'any';
    let currentTheme = 'default';
    let activeHeroes = [];
    let trackItems = [];

    const track = document.getElementById('track');
    const selectedNameEl = document.getElementById('selectedName');
    const heroCountEl = document.getElementById('heroCount');
    const wrapper = document.getElementById('wrapper');
    const hitmarker = document.getElementById('hitmarker');

    let currentX = 0;
    let velocity = 0;
    let pendingScroll = 0;
    let isDragging = false;
    let lastX = 0;
    let lastTime = 0;
    let animId = null;
    let centerIndex = -1;
    let lastHitTime = 0;
    let recentWheelTimes = [];  // timestamps of recent wheel events for intensity

    function getFilteredHeroes() {
      return ALL_HEROES.filter(h => {
        if (currentAttr !== 'any' && h.attr !== currentAttr) return false;
        return true;
      });
    }

    function rebuildTrack() {
      activeHeroes = getFilteredHeroes();
      heroCountEl.textContent = activeHeroes.length + ' heroes available';

      // Many repeats so the infinite wrap always has room
      const REPEATS = Math.max(12, Math.ceil(40 / Math.max(1, activeHeroes.length)));
      trackItems = [];
      for (let r = 0; r < REPEATS; r++) {
        trackItems = trackItems.concat(activeHeroes);
      }
      window._heroRepeats = REPEATS;

      track.innerHTML = '';
      trackItems.forEach((hero, idx) => {
        const card = document.createElement('div');
        card.className = 'hero-card';
        card.dataset.index = idx;
        card.dataset.name = hero.name;
        card.innerHTML = `
          <img src="${IMG_BASE}${hero.id}.png" alt="${hero.name}" loading="lazy"
               onerror="this.src='https://cdn.dota2.com/apps/dota2/images/heroes/${hero.id}_lg.png'">
          <div class="name">${hero.name}</div>
        `;
        track.appendChild(card);
      });

      const totalCards = trackItems.length;
      if (totalCards === 0) {
        selectedNameEl.textContent = 'No heroes';
        return;
      }
      const middleStart = Math.floor(REPEATS / 2) * activeHeroes.length;
      currentX = -middleStart * CARD_WIDTH + (wrapper.clientWidth / 2 - CARD_WIDTH / 2);
      velocity = 0;
      pendingScroll = 0;
      recentWheelTimes = [];
      updateTransform();
    }

    function wrapInfinite() {
      // Keep the track in the middle of the duplicated list so it never runs out of heroes
      if (activeHeroes.length === 0 || trackItems.length === 0) return;
      const setWidth = activeHeroes.length * CARD_WIDTH;
      const centerOffset = wrapper.clientWidth / 2 - CARD_WIDTH / 2;
      const totalWidth = trackItems.length * CARD_WIDTH;

      // If we drift too far toward either end, jump by one full set of heroes
      // This keeps the visual continuous while staying inside the long track
      const minX = -(totalWidth - setWidth * 2) + centerOffset;
      const maxX = -setWidth + centerOffset;

      while (currentX > maxX) {
        currentX -= setWidth;
      }
      while (currentX < minX) {
        currentX += setWidth;
      }
    }

    function updateTransform() {
      wrapInfinite();
      track.style.transform = `translateX(${currentX}px)`;
      updateCenterCard();
    }

    function updateCenterCard() {
      if (trackItems.length === 0) return;
      const centerPos = -currentX + wrapper.clientWidth / 2;
      let idx = Math.round((centerPos - CARD_WIDTH / 2) / CARD_WIDTH);
      // Keep index valid after wrapping
      idx = ((idx % trackItems.length) + trackItems.length) % trackItems.length;

      document.querySelectorAll('.hero-card').forEach(c => c.classList.remove('center'));
      const cards = track.children;
      if (cards[idx]) {
        cards[idx].classList.add('center');
        const name = cards[idx].dataset.name;

        if (selectedNameEl.textContent !== name) {
          selectedNameEl.textContent = name;
          selectedNameEl.classList.remove('pop');
          void selectedNameEl.offsetWidth;
          selectedNameEl.classList.add('pop');
        }
        centerIndex = idx;
      }
    }

    function animate() {
      if (!isDragging) {
        // Drain queued wheel momentum into velocity (weighted feel)
        if (Math.abs(pendingScroll) > 0.1) {
          const drain = pendingScroll * 0.14;
          velocity += drain;
          pendingScroll -= drain;
        } else {
          pendingScroll = 0;
        }

        // Friction – slightly looser while there is still pending scroll so it
        // keeps rolling, then settles a touch quicker once the queue is empty
        const friction = Math.abs(pendingScroll) > 1 ? 0.975 : 0.93;
        velocity *= friction;

        // Soft snap only when everything has settled
        if (Math.abs(velocity) < 0.6 && Math.abs(pendingScroll) < 0.5) {
          const centerPos = -currentX + wrapper.clientWidth / 2;
          const targetIdx = Math.round((centerPos - CARD_WIDTH / 2) / CARD_WIDTH);
          const targetX = -(targetIdx * CARD_WIDTH) + (wrapper.clientWidth / 2 - CARD_WIDTH / 2);
          const diff = targetX - currentX;
          velocity += diff * 0.07;
          if (Math.abs(diff) < 0.4 && Math.abs(velocity) < 0.25) {
            currentX = targetX;
            velocity = 0;
            pendingScroll = 0;
            updateTransform();
            onLandedHero();
            return;
          }
        }

        currentX += velocity;
        updateTransform();
      }

      if (Math.abs(velocity) > 0.04 || Math.abs(pendingScroll) > 0.1 || isDragging) {
        animId = requestAnimationFrame(animate);
        return;
      }

      // Velocity can fall below the cutoff while the card is still a pixel or
      // two off-center. Keep easing until it actually reaches the target so
      // the landing callback always fires.
      if (!isDragging && Math.abs(pendingScroll) < 0.5) {
        const centerPos = -currentX + wrapper.clientWidth / 2;
        const targetIdx = Math.round((centerPos - CARD_WIDTH / 2) / CARD_WIDTH);
        const targetX = -(targetIdx * CARD_WIDTH) + (wrapper.clientWidth / 2 - CARD_WIDTH / 2);
        if (Math.abs(targetX - currentX) > 0.4) {
          animId = requestAnimationFrame(animate);
        }
      }
    }

    function startAnim() {
      if (animId) cancelAnimationFrame(animId);
      animId = requestAnimationFrame(animate);
    }

    function playHitmarker() {
      if (currentTheme !== 'mlg') return;
      const now = performance.now();
      if (now - lastHitTime < 40) return;
      lastHitTime = now;
      try {
        // Clone so overlapping hits can play without cutting each other off
        const s = hitmarker.cloneNode();
        s.volume = 0.5;
        s.play().catch(() => {});
      } catch (e) {}
    }

    // ---- MLG animated background ----
    const MLG_SPRITES = ['🎺', '💥', '🎯', '☠️', '🔥', '👽', '🍕', '🚀', '💀', '🎮', '⚡', '🌀'];
    function buildMlgBackground() {
      const layer = document.getElementById('mlgSprites');
      const count = window.innerWidth < 700 ? 10 : 18;
      for (let i = 0; i < count; i++) {
        const s = document.createElement('span');
        s.textContent = MLG_SPRITES[Math.floor(Math.random() * MLG_SPRITES.length)];
        s.style.left = (Math.random() * 100) + 'vw';
        s.style.top = (55 + Math.random() * 65) + 'vh';
        s.style.fontSize = (1.6 + Math.random() * 2.8).toFixed(1) + 'rem';
        s.style.animationDuration = (6 + Math.random() * 9).toFixed(1) + 's';
        s.style.animationDelay = (-Math.random() * 12).toFixed(1) + 's';
        layer.appendChild(s);
      }
    }
    buildMlgBackground();

    // ---- MLG crosshair ticks ----
    const mlgTicksEl = document.getElementById('mlgTicks');
    let liveTicks = 0;

    function spawnMlgTick(x, y) {
      if (currentTheme !== 'mlg') return;
      if (liveTicks > 140) return; // safety valve for very fast trackpads
      const t = document.createElement('span');
      t.className = 'mlg-tick' + (Math.random() < 0.4 ? ' pink' : '');
      // Scatter overlapping ticks so rapid scrolling looks like a spray of hitmarkers
      t.style.left = (x + Math.random() * 36 - 18) + 'px';
      t.style.top = (y + Math.random() * 36 - 18) + 'px';
      t.style.setProperty('--rot', (Math.random() * 70 - 35).toFixed(1) + 'deg');
      mlgTicksEl.appendChild(t);
      liveTicks++;
      t.addEventListener('animationend', () => { t.remove(); liveTicks--; }, { once: true });
    }

    // ---- MLG landing memes ----
    const MLG_MEMES = [
      { text: 'OH BABY A TRIPLE', emoji: '🎺', sound: 'memes/oh-baby-a-triple.mp3' },
      { text: 'BOOM HEADSHOT',    emoji: '💥', sound: 'memes/boom-headshot.mp3' },
      { text: 'MOM GET THE CAMERA', emoji: '📷', sound: 'memes/mom-get-the-camera.mp3' },
      { text: 'MLG AIRHORN',      emoji: '📢', sound: 'memes/mlg-airhorn.mp3' },
      { text: '360 NO SCOPE',     emoji: '🎯', sound: 'memes/airhorn.mp3' },
      { text: 'GET REKT',         emoji: '☠️', sound: 'https://instrumentalfx.co/wp-content/uploads/2017/12/Hitmarker_-_MLG_Sound_Effect.mp3' }
    ];

    const memeEl = document.getElementById('mlgMeme');
    const memeTextEl = document.getElementById('memeText');
    const memeEmojisEl = document.getElementById('memeEmojis');
    const memeAudios = MLG_MEMES.map(m => {
      const a = new Audio(m.sound);
      a.preload = 'auto';
      a.volume = 0.65;
      return a;
    });

    let memeOrder = [];
    let memeCursor = 0;
    let lastMemePlayed = -1;     // index of the meme shown last (for shuffle)
    let lastLandingIndex = -1;   // hero index of the last meme trigger
    let lastMemeTime = 0;
    let memeTimer = null;
    let memeAudioPrimed = false;

    function shuffleMemeOrder() {
      memeOrder = MLG_MEMES.map((_, i) => i);
      for (let i = memeOrder.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [memeOrder[i], memeOrder[j]] = [memeOrder[j], memeOrder[i]];
      }
      // Don't repeat the previous meme at a cycle boundary
      if (memeOrder[0] === lastMemePlayed && memeOrder.length > 1) {
        [memeOrder[0], memeOrder[1]] = [memeOrder[1], memeOrder[0]];
      }
    }

    function nextMeme() {
      if (memeCursor >= memeOrder.length) {
        shuffleMemeOrder();
        memeCursor = 0;
      }
      lastMemePlayed = memeOrder[memeCursor++];
      return lastMemePlayed;
    }

    function stopMemeAudio() {
      memeAudios.forEach(a => {
        try { a.pause(); a.currentTime = 0; } catch (e) {}
      });
    }

    function showMlgMeme(idx) {
      const meme = MLG_MEMES[idx];
      if (!meme) return;

      memeTextEl.textContent = meme.text;
      memeEmojisEl.innerHTML = '';
      for (let i = 0; i < 7; i++) {
        const span = document.createElement('span');
        span.className = 'meme-emoji';
        span.textContent = meme.emoji;
        span.style.left = (6 + Math.random() * 82) + 'vw';
        span.style.top = (8 + Math.random() * 78) + 'vh';
        span.style.animationDelay = (Math.random() * 0.25).toFixed(2) + 's';
        span.style.transform = 'rotate(' + Math.round(Math.random() * 60 - 30) + 'deg)';
        memeEmojisEl.appendChild(span);
      }

      memeEl.classList.remove('show');
      void memeEl.offsetWidth;
      memeEl.classList.add('show');

      clearTimeout(memeTimer);
      memeTimer = setTimeout(() => memeEl.classList.remove('show'), 1900);

      stopMemeAudio();
      const audio = memeAudios[idx];
      if (audio) {
        audio.currentTime = 0;
        audio.play().catch(() => {});
      }
    }

    function onLandedHero() {
      if (currentTheme !== 'mlg') return;
      const now = performance.now();
      // Re-settling on the same hero shouldn't replay a meme, and rapid
      // little nudges shouldn't spam the overlay
      if (centerIndex === lastLandingIndex && now - lastMemeTime < 2500) return;
      if (now - lastMemeTime < 400) return;
      lastLandingIndex = centerIndex;
      lastMemeTime = now;
      showMlgMeme(nextMeme());
    }

    function onPointerDown(e) {
      isDragging = true;
      track.classList.add('grabbing');
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      lastX = clientX;
      lastTime = performance.now();
      velocity = 0;
      pendingScroll = 0;
      recentWheelTimes = [];
      if (animId) cancelAnimationFrame(animId);
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      e.preventDefault();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const dx = clientX - lastX;
      currentX += dx;

      const now = performance.now();
      const dt = now - lastTime;
      if (dt > 0) velocity = dx / (dt / 16);
      lastX = clientX;
      lastTime = now;
      updateTransform();

      // MLG hitmarker while finger/mouse dragging (every meaningful move)
      if (Math.abs(dx) > 2) {
        spawnMlgTick(clientX, clientY);
        playHitmarker();
      }
    }

    function onPointerUp() {
      if (!isDragging) return;
      isDragging = false;
      track.classList.remove('grabbing');
      velocity *= 1.4;
      startAnim();
    }

    track.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);
    window.addEventListener('mouseleave', onPointerUp);

    track.addEventListener('touchstart', onPointerDown, { passive: false });
    track.addEventListener('touchmove', onPointerMove, { passive: false });
    track.addEventListener('touchend', onPointerUp);

    wrapper.addEventListener('wheel', (e) => {
      e.preventDefault();

      const now = performance.now();

      // Normalize delta across devices: some browsers report lines or pages
      // instead of pixels (Firefox, some trackpads), which previously made a
      // single notch jump far more than on other machines.
      const deltaModeScale = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? wrapper.clientWidth : 1;
      // Clamp a single event so trackpad momentum spikes don't fling the track
      const delta = Math.max(-300, Math.min(300, -e.deltaY * deltaModeScale));

      // Track recent wheel events (last 220ms) to measure how hard user is flicking
      recentWheelTimes.push(now);
      recentWheelTimes = recentWheelTimes.filter(t => now - t < 220);
      const events = recentWheelTimes.length;

      // Gentle stepped boost for deliberate flicks
      //   1 event  → 1.00  (base)
      //   2–3      → 1.07
      //   4–5      → 1.16
      //   6–8      → 1.28
      //   9+       → 1.45
      let boost = 1.0;
      if (events >= 9)      boost = 1.45;
      else if (events >= 6) boost = 1.28;
      else if (events >= 4) boost = 1.16;
      else if (events >= 2) boost = 1.07;

      // One notch is roughly half a card; the queue is capped to a couple of
      // cards so rapid scrolling feels smooth instead of runaway
      pendingScroll += delta * 0.6 * boost;
      pendingScroll = Math.max(-CARD_WIDTH * 2.5, Math.min(CARD_WIDTH * 2.5, pendingScroll));

      // Immediate velocity also gets the same gentle boost
      velocity += delta * 0.02 * boost;

      // MLG hitmarker on every scroll event
      spawnMlgTick(e.clientX, e.clientY);
      playHitmarker();

      startAnim();
    }, { passive: false });

    document.getElementById('spinBtn').addEventListener('click', () => {
      const direction = Math.random() > 0.5 ? 1 : -1;
      velocity = direction * (35 + Math.random() * 50);
      pendingScroll += direction * (80 + Math.random() * 120);
      if (currentTheme === 'mlg') playHitmarker();
      startAnim();
    });

    // Theme toggle (remembered across visits)
    const THEME_KEY = 'dotaslider-theme';

    function applyTheme(theme) {
      if (theme !== 'mlg') theme = 'default';
      currentTheme = theme;
      document.body.className = 'theme-' + theme;
      document.querySelectorAll('#themeFilters .filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.theme === theme);
      });
      try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    }

    document.querySelectorAll('#themeFilters .filter-btn').forEach(btn => {
      btn.addEventListener('click', () => applyTheme(btn.dataset.theme));
    });

    let savedTheme = 'default';
    try { savedTheme = localStorage.getItem(THEME_KEY) || 'default'; } catch (e) {}
    applyTheme(savedTheme);

    // Attribute filters
    document.querySelectorAll('#attrFilters .filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#attrFilters .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentAttr = btn.dataset.attr;
        rebuildTrack();
      });
    });

    window.addEventListener('resize', () => {
      currentX = -centerIndex * CARD_WIDTH + (wrapper.clientWidth / 2 - CARD_WIDTH / 2);
      updateTransform();
    });


    // Unlock audio context on first interaction (required by browsers)
    function unlockAudio() {
      try {
        hitmarker.volume = 0.01;
        hitmarker.play().then(() => {
          hitmarker.pause();
          hitmarker.currentTime = 0;
          hitmarker.volume = 0.5;
        }).catch(() => {});
      } catch (e) {}
      // Prime the meme clips too (silently) so landing sounds work on mobile
      if (!memeAudioPrimed) {
        memeAudioPrimed = true;
        memeAudios.forEach(a => {
          const vol = a.volume;
          a.muted = true;
          a.play().then(() => {
            a.pause();
            a.currentTime = 0;
            a.muted = false;
            a.volume = vol;
          }).catch(() => { a.muted = false; a.volume = vol; });
        });
      }
      window.removeEventListener('click', unlockAudio);
      window.removeEventListener('touchstart', unlockAudio);
      window.removeEventListener('wheel', unlockAudio);
    }
    window.addEventListener('click', unlockAudio);
    window.addEventListener('touchstart', unlockAudio);
    window.addEventListener('wheel', unlockAudio, { passive: true });

    rebuildTrack();
  </script>
